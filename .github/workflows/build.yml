name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read plugin version
        id: plugin
        run: |
          version=$(python -c "import json; print(json.load(open('plugin.json'))['Version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Vendor dependencies into lib/
        run: python -m pip install -r requirements.txt -t ./lib

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r "dist/Flow.Launcher.Plugin.RemoteDesktopManager.zip" . \
            -x "dist/*" ".git/*" ".github/*" ".gitignore" "cache/*" "*.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Flow.Launcher.Plugin.RemoteDesktopManager.zip
          name: v${{ steps.plugin.outputs.version }}
